<div style="margin:0;padding:32px 16px;background:#f5f3ef;font-family:Arial,Helvetica,sans-serif;color:#201b14">
  <div style="max-width:520px;margin:0 auto;border:1px solid #e7ddca;border-radius:24px;overflow:hidden;background:#fff">
    <div style="padding:30px;background:#100d08;text-align:center;border-bottom:3px solid #dca636">
      <div style="color:#f5cf78;font-size:19px;font-weight:800;letter-spacing:1px">HƯƠNG VỊ TUYỆT SẮC</div>
      <div style="margin-top:9px;color:#baaa8c;font-size:10px;letter-spacing:3px">TINH HOA ẨM THỰC VIỆT</div>
    </div>
    <div style="padding:32px">
      <h1 style="margin:0 0 22px;font-size:25px;line-height:1.3">{{heading}}</h1>
      <p style="font-size:14px;line-height:1.7">{{greeting}}</p>
      <p style="color:#6c6252;font-size:14px;line-height:1.7">{{message}}</p>
      <div style="margin:28px 0 12px;padding:24px 12px;text-align:center;background:#fff8e7;border:1px solid #e7ca8c;border-radius:16px;font-size:36px;font-weight:800;letter-spacing:10px;color:#6c4711">{{passcode}}</div>
      <p style="text-align:center;color:#8b723f;font-size:11px;line-height:1.8">{{expiry_text}}</p>
      <hr style="margin:28px 0;border:0;border-top:1px solid #eee7dc"/>
      <p style="color:#8a8173;font-size:12px;line-height:1.8">{{security_note}}</p>
    </div>
  </div>
</div>
